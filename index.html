<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Performance Optimizations -->
    <link rel="modulepreload" href="/src/main.tsx" />
    <link rel="preload" as="style" href="/src/index.css" />
    <meta http-equiv="Cache-Control" content="max-age=31536000" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Back-Forward Cache Optimization -->
    <meta name="pageType" content="portfolio" />
    <meta name="bfcache-opt-in" content="true" />
    
    <!-- Primary Meta Tags -->
    <title>Portfolio | Veer Kakar - Software Engineer</title>
    <meta name="title" content="Portfolio | Veer Kakar - Software Engineer">
    <meta name="description" content="Computer Science undergraduate pursuing an accelerated Master’s degree, with a focus on backend and systems software engineering. I enjoy building performance-critical systems, backend infrastructure, and automation tools, with experience ranging from low-level C++ systems to distributed backend platforms." />
    <meta name="keywords" content="full stack developer, web development, React, Node.js, portfolio">
    <meta name="author" content="Veer Kakar">
    <meta property="og:image" content="/path-to-your-preview-image.jpg">

    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#cc23ec">
    
    <!-- Accessibility -->
    <link rel="canonical" href="https://veerkakar17.github.io/PortfolioWebsite/">
    <meta name="robots" content="index, follow">
    
    <!-- Font Loading Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" media="print" onload="this.media='all'">

      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
    </noscript>
  </head>

</html>
